name: Build and Release

on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Build
        run: |
          xcodebuild \
            -project NetSpeedMonitorSwift.xcodeproj \
            -scheme NetSpeedMonitorSwift \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            ARCHS=arm64 \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package
        run: |
          APP_PATH="DerivedData/Build/Products/Release/NetSpeedMonitorSwift.app"
          test "$(lipo -archs "${APP_PATH}/Contents/MacOS/NetSpeedMonitorSwift")" = arm64
          VERSION=$(plutil -extract CFBundleShortVersionString raw "${APP_PATH}/Contents/Info.plist")
          BUILD=$(plutil -extract CFBundleVersion raw "${APP_PATH}/Contents/Info.plist")
          ZIP_NAME="NetSpeedMonitorSwift-${VERSION}.zip"
          ditto -c -k --keepParent "${APP_PATH}" "${ZIP_NAME}"
          echo "version=${VERSION}" >> "$GITHUB_ENV"
          echo "build=${BUILD}" >> "$GITHUB_ENV"
          echo "asset_path=${ZIP_NAME}" >> "$GITHUB_ENV"
          echo "Version: ${VERSION} (${BUILD})"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.version }}
          generate_release_notes: true
          files: ${{ env.asset_path }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
